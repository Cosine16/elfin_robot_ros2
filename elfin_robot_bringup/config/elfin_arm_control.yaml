/**:
    ros__parameters:
        elfin_ethernet_name: enp2s0  # 板载网口接机械臂 (USB 网卡 enx000ec68eca09 是互联网)
        slave_no: [2, 3, 4]
        joint_names: [elfin_joint2, elfin_joint1, elfin_joint3, elfin_joint4, elfin_joint5, elfin_joint6]
        reduction_ratios: [101.0, 101.0, 101.0, 101.0, 101.0, 101.0]
        count_zeros: [776782,-95010,4927410,5404353,32225351,33387458]  # 顺序 [J2, J1, J3, J4, J5, J6]，2026-08-20 待测机出厂「输入端原点」
        axis_position_factors: [131072.0, 131072.0, 131072.0, 131072.0, 131072.0, 131072.0]
        axis_torque_factors: [2536.224, 2536.224, 5251.283, 5251.283, 15975.05, 15975.05]

controller_manager:
  ros__parameters:
    update_rate: 250  # 上游 humble 默认（工位 Foxy 时期为 50），实机验证后如不稳可回调

    elfin_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      joints:
        - elfin_joint1
        - elfin_joint2
        - elfin_joint3
        - elfin_joint4
        - elfin_joint5
        - elfin_joint6
      publish_rate: 50
      write_op_modes:
        - elfin_joint1
        - elfin_joint2
        - elfin_joint3
        - elfin_joint4
        - elfin_joint5
        - elfin_joint6

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

elfin_arm_controller:
  ros__parameters:
    joints:
     - elfin_joint1
     - elfin_joint2
     - elfin_joint3
     - elfin_joint4
     - elfin_joint5
     - elfin_joint6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 250.0
    action_monitor_rate: 250.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.6
      elfin_joint1: { trajectory: 0.2, goal: 0.1 }
      elfin_joint2: { trajectory: 0.2, goal: 0.1 }
      elfin_joint3: { trajectory: 0.2, goal: 0.1 }
      elfin_joint4: { trajectory: 0.2, goal: 0.1 }
      elfin_joint5: { trajectory: 0.2, goal: 0.1 }
      elfin_joint6: { trajectory: 0.2, goal: 0.1 }
